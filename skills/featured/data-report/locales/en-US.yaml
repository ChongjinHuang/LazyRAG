locale: en-US

classification:
  category: Information & analysis
  tags:
    - Data reports
    - Excel analysis
    - CSV analysis
    - Visual reports

presentation:
  card:
    title: Visual data reports
    description: Turn operating data into a KPI dashboard with trends, efficiency, and recommended actions
    output_type: dashboard
    output_label: Data analysis report
    cover_asset: cover
    result_summary: Demonstrate the complete path from data validation to a management dashboard with an e-commerce example
  detail:
    title: Visual data reports
    description: Originally built into Qwen Office. Upload an Excel or CSV table and generate a visual report with KPIs, charts, detail tables, and analytical insights.
    attachment_hint: An Excel, CSV, or JSON data file

tasks:
  - id: executive-report
    selector:
      title: E-commerce performance cockpit
      description: Build a management report from six months of revenue, profit, and orders
      output_label: Performance analysis report
    launch:
      prompt_short: Create an H1 2026 e-commerce performance report from the sample data.
      prompt: >-
        Use the Data Report Skill to analyze this January-June 2026 e-commerce data. Revenue in CNY 10k: 185, 196, 204, 218, 230, 250; profit in CNY 10k: 52, 56, 59, 64, 70, 82; orders: 7100, 7520, 7810, 8260, 8750, 10275. Produce a single-file HTML management report with KPI cards, revenue and profit trends, order changes, margin, notable anomalies, and three actionable recommendations. Use only the supplied data, state calculation definitions, and do not fabricate year-over-year values.
    replay:
      steps:
        - title: Align metric definitions
          description: Validate six months of revenue, profit, orders, and units
        - title: Calculate core metrics
          description: Summarize scale, growth, margin, and revenue per order
        - title: Build the performance cockpit
          description: Arrange KPI, dual-metric trend, and order modules
        - title: Recommend business actions
          description: Explain key changes, analytical limits, and next actions
    result:
      template: generic_report_v1
      eyebrow: Performance analysis report
      title: H1 2026 e-commerce performance
      summary: Turn six months of operating data into a KPI dashboard, trends, and recommended actions
      highlights:
        - Revenue, profit, and order KPIs
        - Trends, margin, and efficiency
        - Data boundaries and business actions
      image_asset: commerce_dashboard

  - id: trend-report
    selector:
      title: Trend analysis report
      description: Focus on time series, growth rates, and anomalous inflection points
      output_label: Trend analysis report
    launch:
      prompt_short: Analyze trends, growth, and anomalies in my uploaded data.
      prompt: Read the uploaded data and analyze metric trends, growth rates, cycles, and anomalous inflection points over time. Use appropriate charts, produce a browsable HTML report, and state the data scope and analytical limits.
    replay:
      steps:
        - title: Align time definitions
          description: Confirm granularity, metric definitions, and comparable periods
        - title: Calculate changes
          description: Calculate growth rates, moving changes, and major inflection points
        - title: Plot trends
          description: Present important changes with line and comparison charts
        - title: Summarize trend findings
          description: Explain growth, decline, volatility, and what to monitor next
    result:
      template: generic_report_v1
      eyebrow: Trend analysis report
      title: Metric trends, growth, and anomalies
      summary: Focus on time-series changes, growth intervals, inflection points, and anomalies
      highlights:
        - Date range and metric definitions
        - Growth rates and key inflection points
        - Anomalies and monitoring recommendations

  - id: dimension-report
    selector:
      title: Multi-dimensional comparison
      description: Compare performance across regions, channels, products, or audiences
      output_label: Multi-dimensional report
    launch:
      prompt_short: Compare my uploaded data across multiple dimensions.
      prompt: Read the uploaded table, identify dimensions such as region, channel, product, or audience, aggregate and rank key metrics, and produce a visual HTML report with comparisons, details, and conclusions.
    replay:
      steps:
        - title: Identify analysis dimensions
          description: Confirm the business fields available for grouped comparison
        - title: Aggregate and rank
          description: Calculate group metrics, contribution shares, and rankings
        - title: Present structural differences
          description: Show gaps with comparison charts and detail tables
        - title: Form recommendations
          description: Identify high and low performers and potential improvements
    result:
      template: generic_report_v1
      eyebrow: Multi-dimensional report
      title: Group performance and contribution
      summary: Compare business dimensions by performance, contribution, and improvement opportunities
      highlights:
        - Group metrics and rankings
        - Contribution structure and performance gaps
        - Actions for high and low performers
