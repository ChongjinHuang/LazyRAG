<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双 Agent 开发审查</title>
<style>:root{--ink:#16233b;--muted:#66758b;--accent:#2c65d8;--soft:#edf4ff;--line:#dce5f2}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}.shell{max-width:1160px;margin:auto;padding:28px}.hero{padding:25px 30px;border-radius:20px;background:linear-gradient(135deg,#172a4d,#284fc4);color:#fff}.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;color:#dbe7ff}.visual{margin:18px 0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 12px 34px #172a4d18}.visual img{display:block;width:100%}.caption{padding:11px 16px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:17px;border:1px solid var(--line);border-radius:15px;background:#fff}.card b{display:block;color:var(--accent);margin-bottom:5px}.gate{margin-top:15px;padding:16px 18px;border-radius:14px;background:var(--soft)}@media(max-width:720px){.shell{padding:14px}.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}</style></head>
<body><main class="shell"><header class="hero"><h1>双 Agent 开发与独立审查</h1><p>实现 Agent 不能自我验收；所有变更必须经过交接门禁和独立 Reviewer</p></header>
<figure class="visual"><img src="{{asset_url:case_visual}}" alt="双 Agent 开发审查、并行研究和故障响应三种编排流程"><figcaption class="caption">步骤执行案例：角色、并行关系、交接门禁、回退环与最终验收均可追踪</figcaption></figure>
<section class="grid"><article class="card"><b>Builder Agent</b>修改批量导出 API，提交代码、配置、测试、接口说明和已知风险。</article><article class="card"><b>Handoff Gate</b>检查范围完整、测试可运行、变更可定位；缺一项即退回补齐。</article><article class="card"><b>Reviewer Agent</b>独立检查正确性、权限、边界、性能和回归；只输出证据化结论。</article></section>
<div class="gate"><strong>验收与回退：</strong>Review 有阻塞项时回到 Builder，修复后重新交接；仅当自动测试通过、审查无阻塞且负责人确认，流程才能进入 Final Acceptance。</div></main></body></html>
