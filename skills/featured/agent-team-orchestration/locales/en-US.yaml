presentation:
  card:
    title: Agent team orchestration
    description: Plan roles, dependencies, parallel execution, handoffs, and acceptance criteria for complex work
    output_type: report
    output_label: Agent orchestration plan
    cover_asset: cover
    result_summary: Explore three complete Agent team orchestration examples
  detail:
    title: Agent team orchestration
    description: 'Break a complex goal into assignable tasks with agent roles, dependencies, input/output contracts, review
      gates, and failure recovery. Source: https://skillhub.cn/skills/clawhub_arminnaimi/agent-team-orchestration, adapted
      for LazyMind.'
    attachment_hint: Project goals, constraints, existing code or documents, team roles, and deadline
tasks:
- id: build-review
  selector:
    title: Two-agent build and review
    description: Design the handoff between implementation and independent review
    output_label: Agent orchestration plan
  launch:
    prompt_short: Design the handoff between implementation and independent review
    prompt: Use the Agent Team Orchestration Skill to design a two-agent workflow for adding bulk export to an existing API.
      One agent implements and one independently reviews. Define scope, dependencies, handoff artifacts, acceptance criteria,
      failure recovery, and final ownership.
  replay:
    steps:
    - title: Understand the goal
      description: Identify the audience, scenario, constraints, and expected deliverable
    - title: Structure the approach
      description: Apply the Skill framework to break down the task
    - title: Create the content
      description: Produce a result ready for the target platform or workflow
    - title: Check the delivery
      description: Verify completeness, actionability, and factual boundaries
  result:
    template: html_preview_v1
    eyebrow: Agent orchestration plan
    title: Two-agent build and review
    summary: Design the handoff between implementation and independent review; the page is a reproducible sample preview.
    html_asset: build_review_demo
